name: Monitor funciones La Odisea

on:
  schedule:
    - cron: '0,10,20,30,40,50 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ejecutar monitor
        env:
          FILM_ID: "5875"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node monitor.js

      - name: Guardar estado actualizado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Actualizar estado de funciones [skip ci]"
          git pull --rebase
          git push
